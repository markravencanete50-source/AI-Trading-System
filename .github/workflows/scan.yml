name: market-scans
# Vercel Hobby crons run at most once a day, so the 15-minute session scans run from here for free.
# Repo secrets needed: APP_URL (https://your-app.vercel.app) and CRON_SECRET (same as Vercel env).
# GitHub may delay scheduled runs by several minutes; the API ignores calls outside market hours.
on:
  schedule:
    - cron: "*/15 1-7 * * 1-5"    # PSE: 9:00-15:45 Manila (UTC+8)
    - cron: "*/15 12-21 * * 1-5"  # US: covers 8:30-16:15 New York in both EST and EDT
  workflow_dispatch:
    inputs:
      market:
        description: "PH or US"
        required: true
        default: "PH"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: market-scan
      cancel-in-progress: false
    steps:
      - name: Pick market
        id: m
        env:
          INPUT_MARKET: ${{ github.event.inputs.market }}
        run: |
          if [ -n "$INPUT_MARKET" ]; then
            case "$INPUT_MARKET" in PH|US) echo "markets=$INPUT_MARKET" >> $GITHUB_OUTPUT ;; *) echo "market must be PH or US"; exit 1 ;; esac
          else
            H=$(date -u +%H)
            if [ "$H" -le 7 ]; then echo "markets=PH" >> $GITHUB_OUTPUT; else echo "markets=US" >> $GITHUB_OUTPUT; fi
          fi
      - name: Call scan endpoint
        env:
          MARKETS: ${{ steps.m.outputs.markets }}
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET repo secret is not set yet, skipping scan."
            exit 0
          fi
          for M in $MARKETS; do
            curl -fsS --max-time 120 -X POST "$APP_URL/api/cron/scan?market=$M" \
              -H "Authorization: Bearer $CRON_SECRET"
            echo
          done
